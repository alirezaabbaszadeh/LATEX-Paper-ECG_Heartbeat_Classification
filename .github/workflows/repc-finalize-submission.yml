name: Finalize RPC submission PDFs

on:
  push:
    branches:
      - repc-submission
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out RPC submission branch
        uses: actions/checkout@v4
        with:
          ref: repc-submission
          fetch-depth: 0
          lfs: true

      - name: Install LaTeX toolchain & tools
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-science texlive-pictures texlive-fonts-recommended poppler-utils ghostscript imagemagick

      - name: Build main manuscript PDF
        working-directory: paper-joe-submission/src
        run: |
          set -euo pipefail
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          pdftotext main.pdf - | grep -F "Vahid Torkzadeh: Supervision, Writing" >/dev/null

      - name: Build submission ancillary PDFs
        working-directory: paper-joe-submission/submission
        run: |
          set -euo pipefail
          latexmk -pdf -interaction=nonstopmode -halt-on-error 01_Cover_Letter_Revista_Portuguesa_de_Cardiologia.tex
          latexmk -pdf -interaction=nonstopmode -halt-on-error 03_Ethical_Statement.tex
          latexmk -pdf -interaction=nonstopmode -halt-on-error 04_Graphical_Abstract.tex
          latexmk -pdf -interaction=nonstopmode -halt-on-error 05_Title_Page_with_Author_Details.tex
          
          # Convert graphical abstract to high-res PNG for Elsevier submission
          pdftoppm -png -r 300 04_Graphical_Abstract.pdf 04_Graphical_Abstract
          mv 04_Graphical_Abstract-1.png 04_Graphical_Abstract.png

      - name: Materialize submission PDFs
        run: |
          set -euo pipefail
          cp paper-joe-submission/src/main.pdf paper-joe-submission/submission/02_Manuscript_Record_Level_ECG_Classification.pdf
          mkdir -p .git/info
          printf '%s\n' 'paper-joe-submission/submission/*.pdf -filter -diff -merge -text' >> .git/info/attributes
          printf '%s\n' 'paper-joe-submission/submission/*.png -filter -diff -merge -text' >> .git/info/attributes

      - name: Commit final PDFs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f paper-joe-submission/submission/
          if git diff --cached --quiet; then
            echo "Submission PDFs already current."
            exit 0
          fi
          git commit -m "Build and publish final RPC submission artifacts [skip ci]"
          git push origin repc-submission
