name: Finalize REPC submission PDFs

on:
  push:
    branches:
      - repc-submission
      - repc-finalization-2026-08-29
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current submission branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          lfs: true

      - name: Install LaTeX toolchain and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-science texlive-pictures texlive-fonts-recommended texlive-lang-portuguese poppler-utils ghostscript imagemagick

      - name: Build main manuscript PDF
        working-directory: paper-joe-submission/src
        run: |
          set -euo pipefail
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          pdftotext main.pdf - | grep -F "Vahid Torkzadeh: Supervision, Writing" >/dev/null
          pdftotext main.pdf - | grep -F "Declarations of interest: none." >/dev/null
          pdftotext main.pdf - | grep -F "ECG Heartbeat Classification GitHub repository" >/dev/null

      - name: Build submission ancillary PDFs
        working-directory: paper-joe-submission/submission
        run: |
          set -euo pipefail
          latexmk -pdf -interaction=nonstopmode -halt-on-error 01_Cover_Letter_Revista_Portuguesa_de_Cardiologia.tex
          latexmk -pdf -interaction=nonstopmode -halt-on-error 03_Ethical_Statement.tex
          latexmk -pdf -interaction=nonstopmode -halt-on-error 04_Graphical_Abstract.tex
          latexmk -pdf -interaction=nonstopmode -halt-on-error 05_Title_Page_with_Author_Details.tex
          latexmk -pdf -interaction=nonstopmode -halt-on-error 06_Declaration_of_Interest_Statement.tex
          latexmk -pdf -interaction=nonstopmode -halt-on-error 07_Portuguese_Title_Abstract_Keywords.tex

          pdftoppm -png -r 300 -singlefile 04_Graphical_Abstract.pdf 04_Graphical_Abstract
          identify 04_Graphical_Abstract.png

      - name: Materialize manuscript PDF
        run: |
          set -euo pipefail
          cp paper-joe-submission/src/main.pdf paper-joe-submission/submission/02_Manuscript_Record_Level_ECG_Classification.pdf
          mkdir -p .git/info
          printf '%s\n' 'paper-joe-submission/submission/*.pdf -filter -diff -merge -text' >> .git/info/attributes
          printf '%s\n' 'paper-joe-submission/submission/*.png -filter -diff -merge -text' >> .git/info/attributes

      - name: Submission preflight
        run: |
          set -euo pipefail
          test -s paper-joe-submission/submission/02_Manuscript_Record_Level_ECG_Classification.pdf
          test -s paper-joe-submission/submission/04_Graphical_Abstract.pdf
          test -s paper-joe-submission/submission/04_Graphical_Abstract.png
          test -s paper-joe-submission/submission/05_Title_Page_with_Author_Details.pdf
          test -s paper-joe-submission/submission/06_Declaration_of_Interest_Statement.pdf
          test -s paper-joe-submission/submission/07_Portuguese_Title_Abstract_Keywords.pdf

          dims="$(identify -format '%w %h' paper-joe-submission/submission/04_Graphical_Abstract.png)"
          width="${dims% *}"
          height="${dims#* }"
          echo "Graphical abstract PNG: ${width}x${height}"
          test "${width}" -ge 1328
          test "${height}" -ge 531

      - name: Commit current submission artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f paper-joe-submission/submission/
          if git diff --cached --quiet; then
            echo "Submission artifacts already current."
            exit 0
          fi
          git commit -m "Build and publish current REPC submission artifacts [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
